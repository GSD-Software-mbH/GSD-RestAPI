name: gsd_restapi
description: "DOCUframe REST API client with encrypted login, session recovery, native V1/V3 endpoints, batching, uploads, and telemetry."
version: 0.3.1
resolution: workspace
repository: https://github.com/GSD-Software-mbH/GSD-RestAPI
homepage: https://gsd-software.com
documentation: https://github.com/GSD-Software-mbH/GSD-RestAPI

environment:
  sdk: ^3.10.0

dependencies:
  equatable: ^2.1.0
  http: ^1.6.0
  iso8601_duration: ^1.2.1
  json_annotation: ^4.12.0
  meta: ^1.9.0
  pointycastle: ^4.0.0
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.1
  coverage: ^1.15.1
  crypto: ^3.0.7
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  test: ^1.31.1
  very_good_analysis: ^10.3.0

topics:
  - rest-api
  - http-client
  - session-management
  - encryption
  - authentication

# Public test-only keys: the local HTTPS test server (CN=localhost) and the crypto test
# vectors (see test/fixtures/crypto/README.md); they protect nothing.
false_secrets:
  - /test/fixtures/self_signed_certificate.dart
  - /test/fixtures/crypto/
